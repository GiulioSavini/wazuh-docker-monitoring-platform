name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install yamllint ruff
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: YAML
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            ansible/ docker-compose.yml docker/traefik/

      - name: Python
        run: ruff check scripts/

      - name: Shell
        run: find scripts/ -name '*.sh' -exec shellcheck -S warning {} +

      - name: Wazuh rule XML
        run: ./scripts/validate-rules-xml.py

      - name: Docker Compose
        run: docker compose config --quiet

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible ansible-lint
      # Without these, ansible-lint cannot resolve ansible.windows or
      # community.general and reports every task using them as an unknown module.
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - working-directory: ansible
        run: ansible-lint playbooks/ roles/
